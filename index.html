<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>₹1Cr Engine — Data Science Transformation System</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --g:#00ff88;--c:#00d4ff;--p:#bf00ff;--r:#ff2d55;--y:#ffcc00;--o:#ff6b00;
  --bg:#030305;--s0:#07070d;--s1:#0c0c16;--s2:#12121f;--s3:#18182a;
  --border:#1e1e35;--border2:#2a2a45;
  --t0:#ffffff;--t1:#c8c8e0;--t2:#888899;--t3:#444455;
  --fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;--fm:'Space Mono',monospace;
  --glow-g:0 0 20px #00ff8855,0 0 40px #00ff8822;
  --glow-c:0 0 20px #00d4ff55,0 0 40px #00d4ff22;
  --glow-p:0 0 20px #bf00ff55,0 0 40px #bf00ff22;
  --glow-r:0 0 20px #ff2d5555,0 0 40px #ff2d5522;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--t0);font-family:var(--fb);font-size:15px;overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.6}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(ellipse 60% 40% at 80% 20%,#bf00ff08 0%,transparent 60%),
    radial-gradient(ellipse 50% 40% at 20% 70%,#00d4ff06 0%,transparent 60%),
    linear-gradient(#0c0c1a06 1px,transparent 1px),linear-gradient(90deg,#0c0c1a06 1px,transparent 1px);
  background-size:100% 100%,100% 100%,60px 60px,60px 60px}
::-webkit-scrollbar{width:4px;background:var(--s0)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
h1,h2,h3,h4,h5{font-family:var(--fh);font-weight:700;letter-spacing:-.3px;line-height:1.2}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:var(--fb)}
input,select,textarea{font-family:var(--fb)}
a{color:var(--c);text-decoration:none}

/* ── LAYOUT ── */
.app{position:relative;z-index:1;min-height:100vh;display:flex}
.sidebar{width:68px;position:fixed;top:0;left:0;bottom:0;z-index:200;background:rgba(3,3,5,.96);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:4px;backdrop-filter:blur(20px)}
.logo-mark{width:36px;height:36px;margin-bottom:20px;position:relative;cursor:pointer}
.logo-mark svg{width:100%;height:100%;animation:logoSpin 20s linear infinite}
@keyframes logoSpin{to{transform:rotate(360deg)}}
.nav-item{width:46px;height:46px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;transition:all .2s;color:var(--t3);border:1px solid transparent;position:relative}
.nav-item:hover{background:var(--s2);color:var(--t2)}
.nav-item.active{background:rgba(0,255,136,.06);border-color:rgba(0,255,136,.25);color:var(--g);box-shadow:0 0 15px rgba(0,255,136,.15)}
.nav-icon{font-size:17px;line-height:1}
.nav-label{font-size:8px;font-family:var(--fm);letter-spacing:.8px;text-transform:uppercase}
.nav-tooltip{position:absolute;left:54px;top:50%;transform:translateY(-50%);background:var(--s2);border:1px solid var(--border2);border-radius:6px;padding:5px 10px;font-size:11px;white-space:nowrap;color:var(--t1);pointer-events:none;opacity:0;transition:.15s;font-family:var(--fm);z-index:300}
.nav-item:hover .nav-tooltip{opacity:1}
.main{margin-left:68px;flex:1;min-height:100vh}
.topbar{position:fixed;top:0;left:68px;right:0;z-index:100;height:54px;background:rgba(3,3,5,.92);border-bottom:1px solid var(--border);backdrop-filter:blur(24px);display:flex;align-items:center;padding:0 28px;gap:16px}
.topbar-title{font-family:var(--fh);font-size:14px;font-weight:700;letter-spacing:.5px;color:var(--g)}
.topbar-path{display:flex;align-items:center;gap:6px;font-family:var(--fm);font-size:10px;color:var(--t3)}
.topbar-path span{color:var(--t2)}
.topbar-sep{flex:1}
.path-chip{display:flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--border2);border-radius:4px;font-family:var(--fm);font-size:10px;color:var(--t2);background:var(--s1)}
.path-dot{width:5px;height:5px;border-radius:50%;background:var(--g);box-shadow:0 0 6px var(--g);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.content{padding:76px 32px 48px;max-width:1360px;margin:0 auto}

/* ── CARDS ── */
.card{background:var(--s0);border:1px solid var(--border);border-radius:12px;transition:all .2s;overflow:hidden}
.card:hover{border-color:var(--border2);transform:translateY(-2px)}
.card-glow-g:hover{border-color:rgba(0,255,136,.3);box-shadow:var(--glow-g)}
.card-glow-c:hover{border-color:rgba(0,212,255,.3);box-shadow:var(--glow-c)}
.card-glow-p:hover{border-color:rgba(191,0,255,.3);box-shadow:var(--glow-p)}
.card-glow-r:hover{border-color:rgba(255,45,85,.3);box-shadow:var(--glow-r)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:500;border:1px solid;transition:all .2s;white-space:nowrap;letter-spacing:.2px;background:transparent}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--g);border-color:var(--g);color:#000;font-weight:700}
.btn-primary:hover{box-shadow:var(--glow-g);transform:translateY(-2px)}
.btn-g{background:rgba(0,255,136,.08);border-color:rgba(0,255,136,.3);color:var(--g)}
.btn-g:hover{background:rgba(0,255,136,.15);box-shadow:var(--glow-g)}
.btn-c{background:rgba(0,212,255,.08);border-color:rgba(0,212,255,.3);color:var(--c)}
.btn-c:hover{background:rgba(0,212,255,.15);box-shadow:var(--glow-c)}
.btn-p{background:rgba(191,0,255,.08);border-color:rgba(191,0,255,.3);color:var(--p)}
.btn-p:hover{background:rgba(191,0,255,.15);box-shadow:var(--glow-p)}
.btn-r{background:rgba(255,45,85,.08);border-color:rgba(255,45,85,.3);color:var(--r)}
.btn-r:hover{background:rgba(255,45,85,.15);box-shadow:var(--glow-r)}
.btn-ghost{border-color:var(--border2);color:var(--t2)}
.btn-ghost:hover{border-color:var(--t3);color:var(--t1)}
.btn-sm{padding:6px 14px;font-size:12px}
.btn-lg{padding:14px 32px;font-size:16px;font-weight:700}

/* ── FORM ELEMENTS ── */
.input{background:var(--s1);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--t0);font-family:var(--fb);font-size:14px;outline:none;width:100%;transition:.2s}
.input:focus{border-color:rgba(0,212,255,.5);box-shadow:0 0 0 3px rgba(0,212,255,.1)}
.input::placeholder{color:var(--t3)}
select.input option{background:var(--s2)}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:4px;font-family:var(--fm);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;border:1px solid}
.badge-g{background:rgba(0,255,136,.1);color:var(--g);border-color:rgba(0,255,136,.3)}
.badge-c{background:rgba(0,212,255,.1);color:var(--c);border-color:rgba(0,212,255,.3)}
.badge-p{background:rgba(191,0,255,.1);color:var(--p);border-color:rgba(191,0,255,.3)}
.badge-r{background:rgba(255,45,85,.1);color:var(--r);border-color:rgba(255,45,85,.3)}
.badge-y{background:rgba(255,204,0,.1);color:var(--y);border-color:rgba(255,204,0,.3)}
.badge-o{background:rgba(255,107,0,.1);color:var(--o);border-color:rgba(255,107,0,.3)}

/* ── SECTION HEADERS ── */
.sec-eyebrow{font-family:var(--fm);font-size:10px;color:var(--t3);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.sec-eyebrow::before{content:'';width:24px;height:1px;background:var(--g);box-shadow:0 0 6px var(--g)}
.sec-title{font-family:var(--fh);font-size:clamp(22px,3vw,32px);font-weight:800;margin-bottom:8px}
.sec-sub{color:var(--t2);font-size:15px;max-width:600px;line-height:1.7}
.grad-g{background:linear-gradient(135deg,var(--g),var(--c));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.grad-p{background:linear-gradient(135deg,var(--p),var(--c));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* ── PROGRESS ── */
.prog-bar{height:4px;background:var(--s2);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.prog-fill-g{background:linear-gradient(90deg,var(--g),var(--c))}
.prog-fill-p{background:linear-gradient(90deg,var(--p),var(--r))}
.prog-fill-y{background:linear-gradient(90deg,var(--y),var(--o))}

/* ── STATS ── */
.stat-card{padding:22px;border-radius:12px;background:var(--s0);border:1px solid var(--border);position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px}
.stat-card-g::after{background:linear-gradient(90deg,var(--g),var(--c));box-shadow:0 0 10px var(--g)}
.stat-card-p::after{background:linear-gradient(90deg,var(--p),var(--r));box-shadow:0 0 10px var(--p)}
.stat-card-y::after{background:linear-gradient(90deg,var(--y),var(--o));box-shadow:0 0 10px var(--y)}
.stat-card-c::after{background:linear-gradient(90deg,var(--c),var(--p));box-shadow:0 0 10px var(--c)}
.stat-value{font-family:var(--fh);font-size:34px;font-weight:800;line-height:1}
.stat-label{font-family:var(--fm);font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1.5px;margin-top:6px}

/* ── PHASE BLOCKS ── */
.phase-block{border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:.2s}
.phase-header{padding:22px 26px;display:flex;align-items:center;gap:20px;cursor:pointer;background:var(--s0)}
.phase-header:hover{background:var(--s1)}
.phase-num{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:20px;font-weight:800;flex-shrink:0}
.phase-body{padding:24px 26px;border-top:1px solid var(--border);background:var(--bg)}

/* ── PROJECT CARDS ── */
.proj-card{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--s0);transition:.25s;cursor:pointer}
.proj-card:hover{transform:translateY(-4px);border-color:var(--border2)}
.proj-header{padding:24px 24px 16px;border-bottom:1px solid var(--border)}
.proj-body{padding:20px 24px}
.proj-footer{padding:14px 24px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--s1)}
.impact-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:6px;background:rgba(0,255,136,.08);border:1px solid rgba(0,255,136,.2);font-family:var(--fm);font-size:10px;color:var(--g)}

/* ── QUIZ ── */
.quiz-q{padding:22px;background:var(--s0);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:16px}
.quiz-q:hover{border-color:var(--border2);transform:translateX(3px)}
.quiz-q.done{border-left:3px solid var(--g)}
.quiz-q.fail{border-left:3px solid var(--r)}
.q-num{font-family:var(--fm);font-size:10px;color:var(--t3);min-width:32px}
.q-text{flex:1;font-size:14px;font-weight:500;color:var(--t1)}

/* ── MODAL ── */
.modal{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.88);backdrop-filter:blur(16px);display:flex;align-items:flex-start;justify-content:center;padding:20px 16px;overflow-y:auto;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{background:var(--s0);border:1px solid var(--border2);border-radius:16px;width:100%;max-width:900px;margin:auto;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,.9)}
.modal-head{padding:24px 28px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.modal-body{padding:28px;max-height:78vh;overflow-y:auto}

/* ── QUIZ OPTIONS ── */
.q-opt{padding:14px 18px;border:1px solid var(--border);border-radius:8px;background:var(--s1);cursor:pointer;transition:.15s;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;color:var(--t1);font-family:var(--fb);font-size:14px;margin-bottom:8px}
.q-opt:hover:not(.dis){border-color:rgba(0,212,255,.4);background:rgba(0,212,255,.05)}
.q-opt.correct{border-color:rgba(0,255,136,.5);background:rgba(0,255,136,.08);color:var(--g)}
.q-opt.wrong{border-color:rgba(255,45,85,.5);background:rgba(255,45,85,.08);color:var(--r)}
.q-opt.dis{cursor:default}
.opt-key{width:24px;height:24px;border-radius:5px;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:11px;color:var(--t3);flex-shrink:0}
.q-opt.correct .opt-key{border-color:var(--g);color:var(--g);background:rgba(0,255,136,.15)}
.q-opt.wrong .opt-key{border-color:var(--r);color:var(--r);background:rgba(255,45,85,.15)}

/* ── FEEDBACK BOX ── */
.feedback{margin-top:16px;padding:18px;border-radius:10px;animation:slideUp .3s}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.feedback-correct{background:rgba(0,255,136,.06);border:1px solid rgba(0,255,136,.2)}
.feedback-wrong{background:rgba(255,45,85,.06);border:1px solid rgba(255,45,85,.2)}
.feedback-title{font-family:var(--fh);font-weight:700;margin-bottom:6px;font-size:14px}
.feedback-exp{font-size:13px;color:var(--t2);line-height:1.7}

/* ── INCOME SIMULATOR ── */
.income-dial{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px}
.income-amount{font-family:var(--fh);font-size:clamp(36px,6vw,64px);font-weight:800;line-height:1}
.income-change{font-family:var(--fm);font-size:13px;color:var(--g);margin-top:8px}

/* ── TIMELINE ── */
.timeline{position:relative;padding-left:32px}
.timeline::before{content:'';position:absolute;left:10px;top:8px;bottom:8px;width:1px;background:linear-gradient(180deg,var(--g),var(--p),var(--c))}
.tl-item{position:relative;margin-bottom:28px}
.tl-dot{position:absolute;left:-28px;width:12px;height:12px;border-radius:50%;border:2px solid;top:4px}
.tl-content{padding:16px 20px;background:var(--s0);border:1px solid var(--border);border-radius:10px}

/* ── SCHEDULER ── */
.day-block{padding:14px 16px;background:var(--s1);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;gap:14px}
.day-block.done{border-color:rgba(0,255,136,.2);background:rgba(0,255,136,.04)}
.time-chip{font-family:var(--fm);font-size:10px;color:var(--t3);padding:2px 8px;border:1px solid var(--border);border-radius:3px;min-width:72px;text-align:center}
.task-check{width:20px;height:20px;border-radius:5px;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:.15s;font-size:12px}
.task-check:hover{border-color:var(--g)}
.task-check.checked{background:var(--g);border-color:var(--g);color:#000}

/* ── SKILL RADAR ── */
.skill-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.skill-name{font-family:var(--fm);font-size:11px;color:var(--t2);width:100px;flex-shrink:0}
.skill-bar{flex:1;height:6px;background:var(--s2);border-radius:3px;overflow:hidden}
.skill-fill{height:100%;border-radius:3px;transition:width 1.2s cubic-bezier(.4,0,.2,1)}
.skill-pct{font-family:var(--fm);font-size:10px;color:var(--t3);width:32px;text-align:right;flex-shrink:0}

/* ── NETWORKING TRACKER ── */
.tracker-row{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--s1);border:1px solid var(--border);border-radius:8px;margin-bottom:8px}
.tracker-avatar{width:32px;height:32px;border-radius:8px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}

/* ── GRID LAYOUTS ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.g-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.g-proj{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:22px}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}.g-proj{grid-template-columns:1fr}}

/* ── ENTRANCE SCREEN ── */
.path-selector{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;position:relative;z-index:1}
.path-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;max-width:800px;width:100%;margin:48px auto 0}
.path-card{padding:32px 28px;background:var(--s0);border:1px solid var(--border);border-radius:16px;cursor:pointer;transition:all .3s;text-align:left;position:relative;overflow:hidden}
.path-card::before{content:'';position:absolute;inset:0;opacity:0;transition:.3s}
.path-card:hover{transform:translateY(-6px)}
.path-card.path-a:hover{border-color:rgba(0,255,136,.4);box-shadow:var(--glow-g)}
.path-card.path-b:hover{border-color:rgba(191,0,255,.4);box-shadow:var(--glow-p)}
.path-card.path-c:hover{border-color:rgba(255,204,0,.4);box-shadow:0 0 30px rgba(255,204,0,.2)}
.path-card.path-d:hover{border-color:rgba(0,212,255,.4);box-shadow:var(--glow-c)}
.path-emoji{font-size:36px;margin-bottom:16px;display:block}
.path-name{font-family:var(--fh);font-size:19px;font-weight:800;margin-bottom:6px}
.path-stack{font-family:var(--fm);font-size:10px;color:var(--t3);margin-bottom:12px;letter-spacing:.5px}
.path-desc{font-size:13px;color:var(--t2);line-height:1.6;margin-bottom:16px}
.path-range{display:inline-flex;align-items:center;gap:6px;font-family:var(--fm);font-size:11px;font-weight:700}
@media(max-width:650px){.path-grid{grid-template-columns:1fr}}

/* ── HERO ── */
.hero-tag{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border:1px solid rgba(0,255,136,.25);border-radius:100px;background:rgba(0,255,136,.06);font-family:var(--fm);font-size:10px;color:var(--g);letter-spacing:2px;margin-bottom:24px}
.hero-tag::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--g);box-shadow:0 0 8px var(--g);animation:pulse 1.5s infinite}
.hero-title{font-family:var(--fh);font-size:clamp(38px,5.5vw,68px);font-weight:800;line-height:1.05;letter-spacing:-1.5px;margin-bottom:20px}
.hero-sub{font-size:17px;color:var(--t2);max-width:580px;line-height:1.75;margin-bottom:36px}

/* ── TABS ── */
.tabs{display:flex;gap:4px;padding:4px;background:var(--s1);border-radius:10px;border:1px solid var(--border)}
.tab{padding:8px 18px;border-radius:7px;font-family:var(--fm);font-size:11px;letter-spacing:.5px;cursor:pointer;transition:.2s;color:var(--t3);white-space:nowrap}
.tab.active{background:var(--s2);color:var(--t0);border:1px solid var(--border2)}
.tab:hover:not(.active){color:var(--t2)}

/* ── ALERT ── */
.alert{padding:14px 18px;border-radius:8px;font-size:13px;line-height:1.6;display:flex;gap:12px;align-items:flex-start}
.alert-y{background:rgba(255,204,0,.06);border:1px solid rgba(255,204,0,.2);color:var(--t1)}
.alert-g{background:rgba(0,255,136,.06);border:1px solid rgba(0,255,136,.2);color:var(--t1)}
.alert-r{background:rgba(255,45,85,.06);border:1px solid rgba(255,45,85,.2);color:var(--t1)}

    mode:'fulltime'

  const [modal,setModal]=useState(null);

  const selectPath=(pathId)=>{setUserPath(pathId);setPage('dashboard')};

  if(page==='onboard') return <OnboardScreen onSelect={selectPath}/>;

      </div>
      {modal&&<Modal modal={modal} onClose={()=>setModal(null)}/>}

  );
}

function QuizModal({q,onClose,onSolve}){
  const [selected,setSelected]=useState(null);
  const [submitted,setSubmitted]=useState(false);
  const submit=(i)=>{if(submitted)return;setSelected(i);setSubmitted(true)};
  const correct=selected===q.ans;
  return(
    <div className="modal" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal-box">
        <div className="modal-head">
          <div>
            <div className="flex gap-10 mb-8">
              <span className={`badge ${q.diff==='easy'?'badge-g':q.diff==='med'?'badge-y':'badge-r'}`}>{q.diff}</span>
              {q.tags.map(t=><span key={t} style={{fontFamily:'var(--fm)',fontSize:9,color:'var(--t3)',padding:'2px 6px',border:'1px solid var(--border)',borderRadius:3}}>{t}</span>)}
            </div>
            <h2 style={{fontFamily:'var(--fh)',fontSize:20}}>{q.title}</h2>
          </div>
          <button className="btn btn-sm btn-ghost" onClick={onClose}>✕ Close</button>
        </div>
        <div className="modal-body">
          <div style={{padding:'16px 20px',background:'var(--s1)',border:'1px solid var(--border)',borderLeft:'3px solid var(--c)',borderRadius:8,marginBottom:20}}>
            <div style={{fontFamily:'var(--fm)',fontSize:10,color:'var(--c)',letterSpacing:2,marginBottom:8}}>QUESTION</div>
            <div style={{fontSize:15,color:'var(--t0)',lineHeight:1.7}}>{q.q}</div>
          </div>
          {q.opts.map((opt,i)=>(
            <button key={i} className={`q-opt ${submitted?(i===q.ans?'correct':i===selected&&!correct?'wrong':'dis'):'dis'}`} onClick={()=>submit(i)} style={{cursor:submitted?'default':'pointer'}}>
              <div className="opt-key">{String.fromCharCode(65+i)}</div>
              <span>{opt}</span>
              {submitted&&i===q.ans&&<span style={{marginLeft:'auto',color:'var(--g)',fontSize:14}}>✓</span>}
            </button>
          ))}
          {submitted&&(
            <div className={`feedback ${correct?'feedback-correct':'feedback-wrong'}`}>
              <div className="feedback-title" style={{color:correct?'var(--g)':'var(--r)'}}>{correct?'✓ Correct!':'✗ Incorrect'}</div>
              <div className="feedback-exp">{q.exp}</div>
              <div className="flex gap-12 mt-16">
                {correct&&<button className="btn btn-sm btn-primary" onClick={onSolve}>Mark Done & Continue →</button>}
                <button className="btn btn-sm btn-ghost" onClick={onClose}>Try Another</button>
              </div>
            </div>
          )}
          {!submitted&&<button className="btn btn-sm btn-ghost mt-16" onClick={()=>submit(-1)} style={{opacity:.5}}>Skip question</button>}
        </div>
      </div>
    </div>
  );
}

function TestingPage({userData}){
  const [tab,setTab]=useState('weekly');

  const [testStarted,setTestStarted]=useState(false);

  const startTest=()=>{setTestStarted(true);setTimerActive(true)};
  useEffect(()=>{
    if(timerActive&&timeLeft>0){timerRef.current=setTimeout(()=>setTimeLeft(t=>t-1),1000);}
    else if(timeLeft===0){setTimerActive(false);}
    return()=>clearTimeout(timerRef.current);
  },[timerActive,timeLeft]);
  const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  return(
    <div>

// ─── INCOME PAGE ──────────────────────────────────────────────────────────────
function IncomePage({userData,pathInfo}){
  const [skills,setSkills]=useState({SQL:68,Python:55,ML:30,Deployment:15,Domain:20,Communication:50});
  const calcIncome=()=>{
    const avg=Object.values(skills).reduce((a,b)=>a+b,0)/Object.keys(skills).length;
    if(avg<30) return {min:8,max:15,label:'Entry level analyst'};
    if(avg<45) return {min:12,max:22,label:'Junior Data Analyst/Scientist'};
    if(avg<60) return {min:20,max:35,label:'Mid-level Analyst / DS'};
    if(avg<75) return {min:30,max:55,label:'Senior DS / ML Engineer'};
    if(avg<88) return {min:45,max:80,label:'Lead / Staff DS'};
    return {min:70,max:150,label:'Principal / FAANG / Remote'};
  };
  const inc=calcIncome();
  return(
    <div>
      <div className="section">
        <div className="sec-eyebrow">Income Simulator</div>
        <h1 className="sec-title">Skill → <span className="grad-p">Income</span> Map</h1>
        <p className="sec-sub">Adjust your skill levels to see how your earning potential changes. Every skill gap is an income gap.</p>
      </div>
      <div className="g2 mb-24">
        <div className="card p-28" style={{textAlign:'center'}}>
          <div style={{fontFamily:'var(--fm)',fontSize:10,color:'var(--t3)',letterSpacing:2,marginBottom:20}}>INCOME POTENTIAL RANGE</div>
          <div className="rupee-callout">₹{inc.min}L–₹{inc.max}L</div>
          <div style={{fontFamily:'var(--fm)',fontSize:12,color:'var(--t2)',marginTop:8}}>/year · {inc.label}</div>
          <div className="hr"/>
          <div style={{fontFamily:'var(--fm)',fontSize:11,color:'var(--t3)',marginBottom:8}}>PATH CEILING</div>
          {pathInfo&&<div style={{fontFamily:'var(--fh)',fontSize:22,fontWeight:800,color:pathInfo.color}}>{pathInfo.range}</div>}
          <div className="alert alert-g mt-20">
            <span className="alert-icon">💡</span>
            <span style={{fontSize:12}}>Domain specialization is the biggest unlock. Generalists earn ₹15–25L. Domain specialists earn ₹40L–1.5Cr.</span>
          </div>
        </div>
        <div className="card p-28">
          <div style={{fontFamily:'var(--fm)',fontSize:10,color:'var(--t3)',letterSpacing:2,marginBottom:20}}>ADJUST YOUR SKILLS</div>
          {Object.entries(skills).map(([sk,val])=>(
            <div key={sk} className="mb-16">
              <div className="flex items-center justify-between mb-6">
                <span style={{fontSize:13,fontFamily:'var(--fm)',color:'var(--t1)'}}>{sk}</span>
                <span style={{fontSize:13,fontFamily:'var(--fh)',fontWeight:700,color:val>60?'var(--g)':val>35?'var(--y)':'var(--r)'}}>{val}%</span>
              </div>
              <input type="range" min="0" max="100" value={val} onChange={e=>setSkills(s=>({...s,[sk]:+e.target.value}))}
                style={{width:'100%',accentColor:'var(--g)',cursor:'pointer'}}/>
            </div>
          ))}
        </div>
      </div>
      <div className="sec-eyebrow mb-16">Income Stacking Strategy</div>
      <div className="g3">
        {[
          {source:'India Full-Time (FAANG/top product)',range:'₹45L – ₹1.2Cr CTC',note:'Includes RSUs/ESOPs. In-hand is 50–65% of CTC.',color:'var(--g)'},
          {source:'Remote (US/EU Full-Time)',range:'$80K – $180K',note:'Hardest to land, biggest unlock. Need timezone overlap.',color:'var(--c)'},
          {source:'Freelance / Consulting',range:'₹40–₹250/hr USD',note:'Scales with niche + proof. Slow first 12 months.',color:'var(--y)'},
        ].map((row,i)=>(
          <div key={i} className="card p-20" style={{borderLeft:`3px solid ${row.color}`}}>

        <span className="alert-icon">⚠️</span>
        <strong>Honest math:</strong> Reaching ₹1 Cr/year purely on Indian salary takes 6–9 years for most. The 2–4 year path requires stacking 2–3 income streams or landing remote/FAANG. Plan accordingly.

  );

    {time:'6:00–7:00',task:'SQL Practice — 5 problems on DataLemur',cat:'SQL'},
    {time:'7:00–7:30',task:'Review yesterday\'s mistakes + notes',cat:'Review'},
    {time:'9:00–10:30',task:'Project work: 1 focused building block',cat:'Build'},
    {time:'10:30–11:00',task:'LinkedIn: post 1 insight or comment on 5 posts',cat:'Network'},

            <span className={`badge ${item.cat==='SQL'?'badge-g':item.cat==='Build'?'badge-p':item.cat==='Network'?'badge-c':item.cat==='Python'?'badge-c':'badge-y'}`} style={{fontSize:8}}>{item.cat}</span>
            <div style={{flex:1,fontSize:14,color:tasks[i]?'var(--t3)':'var(--t1)',textDecoration:tasks[i]?'line-through':'none'}}>{item.task}</div>
            <div className={`task-check${tasks[i]?' checked':''}`}>{tasks[i]&&'✓'}</div>
          </div>

      </div>
      <div className="g3 mt-32">

          <div style={{fontFamily:'var(--fh)',fontSize:15,fontWeight:700,marginBottom:8,color:'var(--g)'}}>Weekly Target</div>

                <div className="sec-eyebrow mb-12">Business Impact</div>
                <div className="impact-pill">{p.impact}</div>
                <div style={{fontSize:13,color:'var(--t2)',marginTop:12,fontStyle:'italic'}}>Frame it as: "{p.frame}"</div>
              </div>
            </div>
            <div className="sec-eyebrow mb-12">Execution Steps</div>
            {p.steps.map((s,i)=>(
              <div key={i} className="flex gap-12 mb-12 items-start">
                <div style={{width:28,height:28,borderRadius:8,background:`rgba(${p.color.replace(/[^,\d]/g,'')||'0,255,136'},0.15)`,color:p.color,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--fm)',fontSize:12,fontWeight:700,flexShrink:0}}>{i+1}</div>
                <div style={{flex:1,padding:'4px 0'}}>
                  <div style={{fontSize:14,color:'var(--t1)',lineHeight:1.6}}>{s}</div>
                </div>
              </div>
            ))}
            <div className="card p-20 mt-20" style={{background:'rgba(255,204,0,.04)',borderColor:'rgba(255,204,0,.2)'}}>
              <div style={{fontFamily:'var(--fm)',fontSize:10,color:'var(--y)',letterSpacing:2,marginBottom:8}}>⭐ STAND-OUT MOVE</div>
              <p style={{fontSize:14,color:'var(--t1)',lineHeight:1.7}}>{p.standout}</p>
            </div>
          </div>
        </div>
      </div>
    );
  }
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
